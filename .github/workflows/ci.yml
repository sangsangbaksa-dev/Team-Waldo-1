name: CI
# Feature branches are tested through their PRs. Avoid running the same
# lint/test/build matrix twice for every push + pull_request on active PRs.
on:
  pull_request:
  push:
    branches:
      - feat/shared-menu-rails
      - claude/project-thread-hhffi5
      - claude/funny-noether-4uesaj
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
