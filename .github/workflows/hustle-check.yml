name: HUSTLE focused checks

on:
  push:
    branches:
      - "agent/hustle-*"
    paths:
      - "src/tycoon/**"
      - "tests/tycoon/**"
      - ".github/workflows/hustle-check.yml"
  pull_request:
    paths:
      - "src/tycoon/**"
      - "tests/tycoon/**"
      - ".github/workflows/hustle-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hustle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: HUSTLE lint, types, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint HUSTLE code and tests
        run: npx eslint src/tycoon tests/tycoon
      - name: Check TypeScript (full app)
        if: always()
        run: npm run typecheck
      - name: Run HUSTLE tests
        if: always()
        run: npx vitest run tests/tycoon
      - name: Build production app
        if: always()
        run: npm run build
