name: Last City mission UI smoke
on:
  push:
    branches: [feat/shared-menu-rails, claude/project-thread-hhffi5]
    paths: &city_paths
      - 'src/city/**'
      - 'tests/city/**'
      - 'src/net/**'
      - 'src/audio-core.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/city-browser-smoke.mjs'
      - '.github/workflows/last-city-browser-smoke.yml'
      - '.github/workflows/last-city-core-ci.yml'
  pull_request:
    paths: *city_paths
  workflow_dispatch:

concurrency:
  group: last-city-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Smoke Last City mission journal on desktop and mobile
        timeout-minutes: 5
        run: node tools/city-browser-smoke.mjs
      - name: Upload Last City UI screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-city-ui-evidence
          path: browser-artifacts/last-city-*
          if-no-files-found: warn
          retention-days: 7
