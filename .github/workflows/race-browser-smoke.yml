name: SPEED RUSH browser smoke
on:
  pull_request:
    paths:
      - 'src/race/**'
      - 'tests/race/**'
      - 'tools/race-browser-smoke.mjs'
      - '.github/workflows/race-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: race-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/race-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speed-rush-smoke-screenshots
          path: browser-artifacts/race/
          if-no-files-found: ignore
          retention-days: 5
