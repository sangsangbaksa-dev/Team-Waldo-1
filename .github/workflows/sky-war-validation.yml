name: SKY WAR validation
on:
  push:
    paths:
      - 'src/sky/**'
      - 'tests/sky/**'
      - '.github/workflows/sky-war-validation.yml'
  pull_request:
    paths:
      - 'src/sky/**'
      - 'tests/sky/**'
      - '.github/workflows/sky-war-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sky-war-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sky-war:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src/sky tests/sky
      - run: npm run typecheck
      - run: npx vitest run tests/sky
      - run: npm run build
