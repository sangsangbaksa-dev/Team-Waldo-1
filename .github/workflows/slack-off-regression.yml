name: SLACK OFF regression

on:
  pull_request:
    paths:
      - 'src/slack/**'
      - 'tests/slack/**'
      - '.github/workflows/slack-off-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slack-off-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  slack:
    name: SLACK OFF lint, tests, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint SLACK OFF only
        run: npx eslint src/slack tests/slack
      - name: SLACK OFF regression tests
        run: npx vitest run tests/slack
      - name: Repository typecheck
        run: npm run typecheck
      - name: Production bundle build
        run: npm run build
