name: Speed Rush UI and WebGL smoke
on:
  push:
    branches:
      - agent/games-01-02-quality-20261122
    paths:
      - 'src/race/**'
      - 'tools/race-browser-smoke.mjs'
      - '.github/workflows/speed-rush-browser-smoke.yml'
  pull_request:
    paths:
      - 'src/race/**'
      - 'tools/race-browser-smoke.mjs'
      - '.github/workflows/speed-rush-browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Test SPEED RUSH gameplay and 3D scene on desktop and mobile
        timeout-minutes: 7
        run: node tools/race-browser-smoke.mjs
      - name: Upload SPEED RUSH screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-rush-browser-evidence
          path: browser-artifacts/speed-rush-*
          if-no-files-found: warn
          retention-days: 7
