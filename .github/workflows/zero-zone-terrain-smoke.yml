name: ZERO ZONE terrain smoke
on:
  push:
    branches:
      - feat/shared-menu-rails
    paths:
      - 'src/shooter/**'
      - 'tools/shooter-terrain-shots.mjs'
      - '.github/workflows/zero-zone-terrain-smoke.yml'
  pull_request:
    paths:
      - 'src/shooter/**'
      - 'tools/shooter-terrain-shots.mjs'
      - '.github/workflows/zero-zone-terrain-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-zone-terrain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Render ZERO ZONE interior floors and terrain scenes
        timeout-minutes: 7
        run: node tools/shooter-terrain-shots.mjs browser-artifacts/zero-zone-terrain
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-zone-terrain-evidence
          path: browser-artifacts/zero-zone-terrain/**
          if-no-files-found: warn
          retention-days: 7
